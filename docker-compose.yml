services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: legisassistant
      POSTGRES_PASSWORD: legisassistant
      POSTGRES_DB: legisassistant
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8081:8081"
    depends_on:
      - db
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/legisassistant
      DATABASE_USERNAME: legisassistant
      DATABASE_PASSWORD: legisassistant
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ALLOWED_ORIGINS: http://localhost:5173

volumes:
  db_data:
