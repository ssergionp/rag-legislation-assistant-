spring:
  application:
    name: rag-legislation-assistant

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/legisassistant}
    username: ${DATABASE_USERNAME:legisassistant}
    password: ${DATABASE_PASSWORD:legisassistant}

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-sonnet-4-5
          temperature: 0.2

    vectorstore:
      pgvector:
        # Must match the embedding model's output dimension.
        # all-MiniLM-L6-v2 (the local Transformers model used here) outputs 384.
        dimensions: 384
        distance-type: COSINE_DISTANCE
        index-type: HNSW
        initialize-schema: true

server:
  port: ${PORT:8081}

app:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
